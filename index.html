<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RX7EZZ MUSIC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #090909;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 18px 20px;
      background: rgba(9,9,9,.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid #1d1d1d;
    }
    .logo {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }
    .search {
      width: 100%;
      height: 48px;
      border: 1px solid #292929;
      border-radius: 14px;
      background: #151515;
      color: white;
      padding: 0 16px;
      font-size: 16px;
      outline: none;
    }
    .search:focus {
      border-color: #555;
    }
    main {
      max-width: 1100px;
      margin: auto;
      padding: 28px 20px 130px;
    }
    .hero {
      padding: 25px 0 30px;
    }
    .hero h1 {
      font-size: clamp(34px, 8vw, 64px);
      line-height: .95;
      letter-spacing: -3px;
      margin-bottom: 12px;
    }
    .hero p {
      color: #8d8d8d;
      font-size: 15px;
    }
    section {
      margin-top: 28px;
    }
    .section-title {
      font-size: 22px;
      margin-bottom: 16px;
    }
    .artists {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .artist {
      min-width: 105px;
      text-align: center;
      cursor: pointer;
    }
    .artist img {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 8px;
    }
    .artist-name {
      font-size: 13px;
      font-weight: 700;
    }
    .tracks {
      display: grid;
      gap: 8px;
    }
    .track {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: .2s;
    }
    .track:hover {
      background: #151515;
    }
    .cover {
      width: 58px;
      height: 58px;
      border-radius: 9px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .track-info {
      min-width: 0;
      flex: 1;
    }
    .track-title {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }
    .play {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: white;
      color: black;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .player {
      position: fixed;
      z-index: 20;
      left: 12px;
      right: 12px;
      bottom: 12px;
      background: rgba(25,25,25,.94);
      backdrop-filter: blur(20px);
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,.45);
    }
    .player-cover {
      width: 48px;
      height: 48px;
      border-radius: 9px;
      object-fit: cover;
    }
    .player-info {
      min-width: 0;
      flex: 1;
    }
    .player-title {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-artist {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }
    .player button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 0;
      background: white;
      color: black;
      cursor: pointer;
      font-size: 17px;
    }
    .empty {
      color: #777;
      padding: 30px 0;
      text-align: center;
      display: none;
    }
    @media (min-width: 700px) {
      .tracks {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="logo">RX7EZZ MUSIC</div>
  <input
    id="search"
    class="search"
    type="search"
    placeholder="Поиск артистов и треков..."
  >
</header>
<main>
  <div class="hero">
    <h1>Твоя музыка.<br>Твой звук.</h1>
    <p>Музыкальная платформа RX7EZZ</p>
  </div>
  <section>
    <h2 class="section-title">Артисты</h2>
<div class="artists">
  <div class="artist" data-search="Kizaru">
    <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=300&q=80">
    <div class="artist-name">Kizaru</div>
  </div>
  <div class="artist" data-search="OG Buda">
    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=300&q=80">
    <div class="artist-name">OG Buda</div>
  </div>
  <div class="artist" data-search="Mayot">
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80">
    <div class="artist-name">Mayot</div>
  </div>
  <div class="artist" data-search="Drake">
    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80">
    <div class="artist-name">Drake</div>
  </div>
</div>
  </section>
  <section>
    <h2 class="section-title">Популярное</h2>
<div id="tracks" class="tracks">
  <div class="track" data-search="Kizaru Memphis">
    <img class="cover" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=300&q=80">
    <div class="track-info">
      <div class="track-title">Memphis</div>
      <div class="track-artist">Kizaru</div>
    </div>
    <button class="play" onclick="playTrack('Memphis','Kizaru',this)">▶</button>
  </div>
  <div class="track" data-search="OG Buda Freestyle">
    <img class="cover" src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=300&q=80">
    <div class="track-info">
      <div class="track-title">Freestyle</div>
      <div class="track-artist">OG Buda</div>
    </div>
    <button class="play" onclick="playTrack('Freestyle','OG Buda',this)">▶</button>
  </div>
  <div class="track" data-search="Mayot Detroit">
    <img class="cover" src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=300&q=80">
    <div class="track-info">
      <div class="track-title">Detroit</div>
      <div class="track-artist">Mayot</div>
    </div>
    <button class="play" onclick="playTrack('Detroit','Mayot',this)">▶</button>
  </div>
  <div class="track" data-search="Drake Virginia Beach">
    <img class="cover" src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=300&q=80">
    <div class="track-info">
      <div class="track-title">Virginia Beach</div>
      <div class="track-artist">Drake</div>
    </div>
    <button class="play" onclick="playTrack('Virginia Beach','Drake',this)">▶</button>
  </div>
</div>
<div id="empty" class="empty">
  Ничего не найдено
</div>
  </section>
</main>
<div class="player">
  <img
    id="playerCover"
    class="player-cover"
    src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=300&q=80"
  >
  <div class="player-info">
    <div id="playerTitle" class="player-title">Выбери трек</div>
    <div id="playerArtist" class="player-artist">RX7EZZ MUSIC</div>
  </div>

▶

</div>
<script>
  const search = document.getElementById("search");
  const tracks = document.querySelectorAll(".track");
  const artists = document.querySelectorAll(".artist");
  const empty = document.getElementById("empty");
  let currentPlaying = false;
  search.addEventListener("input", () => {
    const query = search.value.toLowerCase().trim();
    let visible = 0;
    [...tracks, ...artists].forEach(item => {
      const text = item.dataset.search.toLowerCase();
      if (!query || text.includes(query)) {
        item.style.display = "";
        if (item.classList.contains("track")) visible++;
      } else {
        item.style.display = "none";
      }
    });
    empty.style.display = visible === 0 && query ? "block" : "none";
  });
  function playTrack(title, artist, button) {
    document.getElementById("playerTitle").textContent = title;
    document.getElementById("playerArtist").textContent = artist;
    currentPlaying = true;
    document.getElementById("playerButton").textContent = "❚❚";
    document.querySelectorAll(".play").forEach(btn => {
      btn.textContent = "▶";
    });
    button.textContent = "❚❚";
  }
  function togglePlayer() {
    if (!document.getElementById("playerTitle").textContent) return;
    currentPlaying = !currentPlaying;
    document.getElementById("playerButton").textContent =
      currentPlaying ? "❚❚" : "▶";
  }
</script>
</body>
</html>
