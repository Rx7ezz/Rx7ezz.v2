<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rx7ezz Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@audius/sdk@latest/dist/sdk.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 25px 20px 10px;
      position: sticky;
      top: 0;
      background: rgba(8,8,8,.95);
      backdrop-filter: blur(15px);
      z-index: 10;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .search {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      background: #181818;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 15px;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 0 18px;
      background: white;
      color: black;
      font-weight: 800;
      cursor: pointer;
    }

    main {
      padding: 20px;
      padding-bottom: 130px;
    }

    h2 {
      margin-top: 10px;
    }

    #status {
      color: #888;
      margin: 15px 0;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #191919;
      cursor: pointer;
    }

    .cover {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
      background: #202020;
      flex-shrink: 0;
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      color: #888;
      margin-top: 5px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15,15,15,.97);
      border-top: 1px solid #292929;
      padding: 12px 15px;
      z-index: 20;
      backdrop-filter: blur(20px);
    }

    .now {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .now img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
    }

    .now-info {
      flex: 1;
      min-width: 0;
    }

    .now-title {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-artist {
      color: #888;
      font-size: 13px;
      margin-top: 3px;
    }

    audio {
      width: 100%;
      height: 35px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 40px 10px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">RX7EZZ MUSIC</div>

  <div class="search">
    <input
      id="searchInput"
      type="text"
      placeholder="Ищи артиста или трек..."
      autocomplete="off"
    >

    <button onclick="searchMusic()">Найти</button>
  </div>
</header>

<main>

  <h2 id="heading">🔥 Популярное</h2>

  <div id="status">Загрузка...</div>

  <div id="tracks"></div>

</main>

<div class="player">

  <div class="now">
    <img id="nowCover" src="" alt="">

    <div class="now-info">
      <div class="now-title" id="nowTitle">
        Ничего не играет
      </div>

      <div class="now-artist" id="nowArtist">
        Выбери трек
      </div>
    </div>
  </div>

  <audio id="audio" controls></audio>

</div>

<script>

  // ==========================================
  // AUDIUS API KEY
  // ==========================================

  const AUDIUS_API_KEY = "0x35b8abd87d401cbc25ea9e8d475e0efead572974";


  // ==========================================
  // ИНИЦИАЛИЗАЦИЯ AUDIUS
  // ==========================================

  const audius = window.audiusSdk({
    apiKey: AUDIUS_API_KEY
  });


  const tracksContainer =
    document.getElementById("tracks");

  const status =
    document.getElementById("status");

  const heading =
    document.getElementById("heading");

  const searchInput =
    document.getElementById("searchInput");

  const audio =
    document.getElementById("audio");


  // ==========================================
  // ЗАГРУЗКА ПОПУЛЯРНОГО
  // ==========================================

  async function loadTrending() {

    try {

      status.textContent = "Загружаем музыку...";

      const result =
        await audius.tracks.getTrendingTracks({
          limit: 30,
          time: "week"
        });

      const tracks = result.data || [];

      renderTracks(tracks);

      status.textContent =
        tracks.length
          ? `${tracks.length} треков`
          : "Музыка не найдена";

    } catch (error) {

      console.error(error);

      status.textContent =
        "Ошибка загрузки Audius";

      console.error(
        "Audius error:",
        error
      );
    }
  }


  // ==========================================
  // ПОИСК
  // ==========================================

  async function searchMusic() {

    const query =
      searchInput.value.trim();

    if (!query) {

      heading.textContent =
        "🔥 Популярное";

      loadTrending();

      return;
    }

    try {

      heading.textContent =
        `🔎 Результаты: ${query}`;

      status.textContent =
        "Ищем...";

      tracksContainer.innerHTML = "";

      const result =
        await audius.tracks.searchTracks({

          query: query,

          limit: 30,

          sortMethod: "relevant"

        });

      const tracks =
        result.data || [];

      renderTracks(tracks);

      status.textContent =
        tracks.length
          ? `Найдено: ${tracks.length}`
          : "Ничего не найдено";

    } catch (error) {

      console.error(error);

      status.textContent =
        "Ошибка поиска";

    }
  }


  // ==========================================
  // ENTER В ПОИСКЕ
  // ==========================================

  searchInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        searchMusic();

      }

    }
  );


  // ==========================================
  // ОТРИСОВКА ТРЕКОВ
  // ==========================================

  function renderTracks(tracks) {

    tracksContainer.innerHTML = "";

    if (!tracks.length) {

      tracksContainer.innerHTML =
        `<div class="empty">
          Ничего не найдено
        </div>`;

      return;
    }


    tracks.forEach((track) => {

      const item =
        document.createElement("div");

      item.className = "track";


      const artwork =
        track.artwork?.["_150x150"] ||
        track.artwork?.["_480x480"] ||
        "";


      const artist =
        track.user?.name ||
        "Unknown artist";


      item.innerHTML = `

        <img
          class="cover"
          src="${artwork}"
          alt=""
        >

        <div class="info">

          <div class="title">
            ${escapeHTML(track.title || "Без названия")}
          </div>

          <div class="artist">
            ${escapeHTML(artist)}
          </div>

        </div>

        <button class="play">
          ▶
        </button>

      `;


      item
        .querySelector(".play")
        .addEventListener(
          "click",
          function(event) {

            event.stopPropagation();

            playTrack(track);

          }
        );


      item.addEventListener(
        "click",
        function() {

          playTrack(track);

        }
      );


      tracksContainer.appendChild(item);

    });

  }


  // ==========================================
  // ПРОИГРЫВАНИЕ
  // ==========================================

  async function playTrack(track) {

    try {

      if (!track?.id) {

        alert("У трека нет ID");

        return;

      }


      if (
        track.isStreamable === false
      ) {

        alert(
          "Этот трек нельзя стримить"
        );

        return;

      }


      const artwork =
        track.artwork?.["_480x480"] ||
        track.artwork?.["_150x150"] ||
        "";


      document.getElementById(
        "nowCover"
      ).src = artwork;


      document.getElementById(
        "nowTitle"
      ).textContent =
        track.title || "Без названия";


      document.getElementById(
        "nowArtist"
      ).textContent =
        track.user?.name ||
        "Unknown artist";


      /*
        Audius stream endpoint.
        API key передается как query parameter.
      */

      const streamURL =
        `https://api.audius.co/v1/tracks/${track.id}/stream?app_name=RX7EZZ_MUSIC&api_key=${encodeURIComponent(AUDIUS_API_KEY)}`;


      audio.src = streamURL;

      await audio.play();

    } catch (error) {

      console.error(
        "Playback error:",
        error
      );

      alert(
        "Не получилось запустить этот трек"
      );

    }

  }


  // ==========================================
  // ЗАЩИТА HTML
  // ==========================================

  function escapeHTML(text) {

    return String(text)

      .replaceAll("&", "&amp;")

      .replaceAll("<", "&lt;")

      .replaceAll(">", "&gt;")

      .replaceAll('"', "&quot;")

      .replaceAll("'", "&#039;");

  }


  // ==========================================
  // СТАРТ
  // ==========================================

  loadTrending();

</script>

</body>
</html>
